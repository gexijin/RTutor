<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UIUC RTutor – Starting…</title>
  <style>
    :root {
      --navy: #13294b;   /* Illinois blue */
      --orange: #ff5f05; /* Illinois orange */
      --text-1: #dbe4f0;
      --text-2: #9fb0c8;
      --border: rgba(219, 228, 240, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; user-select: none; cursor: default;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      background: radial-gradient(ellipse at 50% 35%, #1d3a66 0%, var(--navy) 55%, #0b1a31 100%);
    }
    .container {
      height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 56px 80px; text-align: center;
    }
    .logo { width: 132px; height: 132px; filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.45)); margin-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0.02em; }
    .tagline { margin: 6px 0 0; font-size: 12px; letter-spacing: 0.08em; color: var(--text-2); text-transform: uppercase; }
    .progress-block { margin-top: 34px; width: 100%; max-width: 460px; }
    .progress { height: 6px; border-radius: 999px; background: rgba(11, 26, 49, 0.9); overflow: hidden;
                box-shadow: 0 0 0 1px var(--border); }
    .progress-fill { height: 100%; width: 8%; border-radius: 999px; background: var(--orange);
                     transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
    .status { margin-top: 14px; font-size: 12px; color: var(--text-1); }
    .hint { margin-top: 6px; font-size: 11px; color: var(--text-2); }
    .footer {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 24px; display: flex; gap: 16px;
      justify-content: space-between; border-top: 1px solid var(--border); font-size: 10px; color: var(--text-2);
    }
    .footer .right { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .footer code { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 10px; }
  </style>
</head>
